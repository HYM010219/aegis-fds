apiVersion: apps/v1
kind: Deployment
metadata:
  name: collector
  namespace: aegis
  labels:
    app: collector
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: collector
  template:
    metadata:
      labels:
        app: collector
    spec:
      containers:
        - name: collector
          # 수집기 전용 이미지: docker build -f collector/Dockerfile -t aegis-collector:latest . (저장소 루트에서)
          image: aegis-collector:latest
          imagePullPolicy: Never
          command: ["python", "-m", "collector.collector_alchemy"]
          envFrom:
            - configMapRef:
                name: aegis-config
            - secretRef:
                name: aegis-env   # GATEWAY_API_KEY, ALCHEMY_WSS_URL
          env:
            # 수집기 코드가 읽는 이름은 FASTAPI_URL (collector_alchemy.py). .env의 localhost 값보다 여기 값이 우선한다.
            - name: FASTAPI_URL
              value: "http://gateway:8000/api/v1/transfers"
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 300m
              memory: 512Mi
