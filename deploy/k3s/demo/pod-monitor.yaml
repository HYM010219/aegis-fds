apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: recovery-demo
  namespace: monitoring
  labels:
    release: mon
spec:
  namespaceSelector:
    matchNames: [aegis]
  selector:
    matchLabels:
      app: recovery-demo
  podMetricsEndpoints:
    - port: metrics
      interval: 5s
      scrapeTimeout: 3s
