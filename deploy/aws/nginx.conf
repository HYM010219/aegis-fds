# Aegis-FDS Production Nginx Reverse Proxy Configuration (Enhanced Security)
server {
    listen 80;
    listen 8080;
    server_name _;

    client_max_body_size 20M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 1) 보안 관리자 관제 콘솔 (/admin/)
    #    IP 허용 + Basic Auth(2중 잠금) 적용
    location /admin {
        alias /var/www/aegis/dist/admin;
        index index.html;
        try_files $uri $uri/ /admin/index.html;

        # Basic Auth 파일이 존재할 경우에만 인증 활성화 (deploy.sh에서 생성)
        auth_basic "Aegis-FDS Security Administration";
        auth_basic_user_file /etc/nginx/.htpasswd;
    }

    # 2) 관리자 관제 전용 백엔드 REST API (/api/v1/admin/)
    #    동결·해제·화이트리스트 등록 등 핵심 기능 보호
    location /api/v1/admin/ {
        auth_basic "Aegis-FDS Security Administration";
        auth_basic_user_file /etc/nginx/.htpasswd;
        include /etc/nginx/admin_key.inc;

        proxy_pass http://gateway:8000/api/v1/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3) 사용자 송금 시뮬레이터 (/) - 공개 테스트베드
    location / {
        root /var/www/aegis/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 4) 일반 출금 게이트웨이 REST API (/api/v1/transfers)
    location /api/ {
        proxy_pass http://gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # 5) 실시간 이상거래 경보 WebSocket (/ws/)
    location /ws/ {
        proxy_pass http://gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
