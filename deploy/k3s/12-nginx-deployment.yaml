apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: aegis
  labels:
    app: nginx
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              hostPort: 80
            - containerPort: 8080
              hostPort: 8080
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: web-dist
              mountPath: /var/www/aegis/dist
            - name: nginx-auth
              mountPath: /etc/nginx/.htpasswd
              subPath: .htpasswd
            - name: nginx-auth
              mountPath: /etc/nginx/admin_key.inc
              subPath: admin_key.inc
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: nginx-conf
          configMap:
            name: nginx-config
        - name: web-dist
          hostPath:
            path: /home/ubuntu/aegis-fds/web/dist
            type: DirectoryOrCreate
        - name: nginx-auth
          secret:
            secretName: nginx-auth-secret
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: aegis
  labels:
    app: nginx
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      name: http
    - port: 8080
      targetPort: 8080
      name: http-alt
  selector:
    app: nginx
