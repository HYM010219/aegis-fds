apiVersion: apps/v1
kind: Deployment
metadata:
  name: publisher
  namespace: aegis
  labels:
    app: publisher
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: publisher
  template:
    metadata:
      labels:
        app: publisher
    spec:
      containers:
        - name: publisher
          image: aegis-gateway:latest
          imagePullPolicy: Never
          command: ["python", "-m", "app.publisher"]
          envFrom:
            - configMapRef:
                name: aegis-config
            - secretRef:
                name: aegis-env
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 250m
              memory: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-consumer
  namespace: aegis
  labels:
    app: alert-consumer
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: alert-consumer
  template:
    metadata:
      labels:
        app: alert-consumer
    spec:
      containers:
        - name: alert-consumer
          image: aegis-gateway:latest
          imagePullPolicy: Never
          command: ["python", "-m", "app.alert_consumer"]
          envFrom:
            - configMapRef:
                name: aegis-config
            - secretRef:
                name: aegis-env
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 250m
              memory: 512Mi
