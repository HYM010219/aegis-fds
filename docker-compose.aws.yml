services:
  nginx:
    image: nginx:1.27-alpine
    container_name: aegis-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - ./deploy/aws/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/aws/.htpasswd:/etc/nginx/.htpasswd:ro
      - ./deploy/aws/admin_key.inc:/etc/nginx/admin_key.inc:ro
      - ./web/dist:/var/www/aegis/dist:ro
    depends_on:
      - gateway

  redis:
    image: redis:7.4
    container_name: aegis-redis
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  mongo:
    image: mongo:7.0
    container_name: aegis-mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status() } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}) }; quit(db.hello().isWritablePrimary ? 0 : 1)"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  gateway:
    build:
      context: ./fds
      dockerfile: app/Dockerfile
    container_name: aegis-gateway
    environment:
      - REDIS_HOST=redis
      - MONGO_URI=${MONGO_URI}
      - MONGO_DB=aegis
      - GATEWAY_API_KEY=${GATEWAY_API_KEY}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-}
      - TRANSFERS_TTL_DAYS=14
      - CLICKHOUSE_URL=http://clickhouse:8123
      - CLICKHOUSE_USER=aegis
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - CLICKHOUSE_DB=aegis
      - PERIOD_PROFILE=${PERIOD_PROFILE:-demo}
      - R05_LIMIT_USDT=${R05_LIMIT_USDT:-100000}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./fds/logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.3.1
    container_name: aegis-kafka
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=false
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  publisher:
    build:
      context: ./fds
      dockerfile: app/Dockerfile
    container_name: aegis-publisher
    command: ["python", "-m", "app.publisher"]
    environment:
      - MONGO_URI=${MONGO_URI}
      - MONGO_DB=aegis
      - KAFKA_BOOTSTRAP=kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  alert-consumer:
    build:
      context: ./fds
      dockerfile: app/Dockerfile
    container_name: aegis-alert-consumer
    command: ["python", "-m", "app.alert_consumer"]
    environment:
      - MONGO_URI=${MONGO_URI}
      - MONGO_DB=aegis
      - KAFKA_BOOTSTRAP=kafka:9092
      - REDIS_HOST=redis
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  spark:
    build: ./fds/spark
    container_name: aegis-spark
    user: root
    command: >
      /opt/spark/bin/spark-submit
      --master local[2]
      --driver-memory 2g
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.7
      --conf spark.jars.ivy=/opt/spark/ivy
      /app/spark/stream.py
    environment:
      - KAFKA_BOOTSTRAP=kafka:9092
      - MONGO_URI=${MONGO_URI}
      - MONGO_DB=aegis
      - REDIS_HOST=redis
      - PERIOD_PROFILE=${PERIOD_PROFILE:-demo}
      - R05_LIMIT_USDT=${R05_LIMIT_USDT:-100000}
      - CHECKPOINT_DIR=/checkpoints/detector
      - STARTING_OFFSETS=latest
    volumes:
      - ./fds/spark:/app/spark:ro
      - ./fds/common:/app/common:ro
      - spark-ivy:/opt/spark/ivy
      - spark-checkpoints:/checkpoints
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    container_name: aegis-clickhouse
    environment:
      - CLICKHOUSE_DB=aegis
      - CLICKHOUSE_USER=aegis
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    ports:
      - "127.0.0.1:8123:8123"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./fds/clickhouse:/docker-entrypoint-initdb.d:ro
      - ./fds/clickhouse/kafka.xml:/etc/clickhouse-server/config.d/kafka.xml:ro
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data:
  mongo-data:
  kafka-data:
  spark-ivy:
  spark-checkpoints:
  clickhouse-data:
