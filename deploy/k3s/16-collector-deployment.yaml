apiVersion: apps/v1
kind: Deployment
metadata:
  name: collector
  namespace: aegis
  labels:
    app: collector
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: collector
  template:
    metadata:
      labels:
        app: collector
    spec:
      containers:
        - name: collector
          image: aegis-gateway:latest
          imagePullPolicy: Never
          command: ["python", "-m", "collector.collector_alchemy"]
          envFrom:
            - configMapRef:
                name: aegis-config
            - secretRef:
                name: aegis-env
          env:
            - name: GATEWAY_URL
              value: "http://gateway:8000/api/v1/transfers"
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 300m
              memory: 512Mi
