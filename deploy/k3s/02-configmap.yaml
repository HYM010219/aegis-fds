apiVersion: v1
kind: ConfigMap
metadata:
  name: aegis-config
  namespace: aegis
data:
  DATA_IP: "10.30.2.10"
  REDIS_HOST: "10.30.2.10"
  REDIS_PORT: "6379"
  KAFKA_BOOTSTRAP: "10.30.2.10:9092"
  CLICKHOUSE_URL: "http://10.30.2.10:8123"
  CLICKHOUSE_USER: "aegis"
  CLICKHOUSE_DB: "aegis"
  MONGO_DB: "aegis"
  PERIOD_PROFILE: "demo"
  TRANSFERS_TTL_DAYS: "14"
  R05_LIMIT_USDT: "100000"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: aegis
data:
  default.conf: |
    server {
        listen 80;
        listen 8080;
        server_name _;

        client_max_body_size 20M;

        # 1) 보안 관리자 관제 콘솔 (/admin/)
        location /admin {
            alias /var/www/aegis/dist/admin;
            index index.html;
            try_files $uri $uri/ /admin/index.html;

            auth_basic "Aegis-FDS Security Administration";
            auth_basic_user_file /etc/nginx/.htpasswd;
        }

        # 2) 관리자 API (/api/v1/admin/)
        location /api/v1/admin/ {
            auth_basic "Aegis-FDS Security Administration";
            auth_basic_user_file /etc/nginx/.htpasswd;
            include /etc/nginx/admin_key.inc;

            proxy_pass http://gateway:8000/api/v1/admin/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3) 공개 송금 시뮬레이터 (/)
        location / {
            root /var/www/aegis/dist;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # 4) 일반 출금 게이트웨이 REST API (/api/)
        location /api/ {
            proxy_pass http://gateway:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 5) 실시간 이상거래 경보 WebSocket (/ws/)
        location /ws/ {
            proxy_pass http://gateway:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # 6) Grafana 모니터링 대시보드 (/grafana/)
        location /grafana/ {
            auth_basic "Aegis-FDS Monitoring";
            auth_basic_user_file /etc/nginx/.htpasswd;
            proxy_pass http://mon-grafana.monitoring.svc.cluster.local:80/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 7) 보안 잠금: Swagger / OpenAPI 문서 외부 노출 차단
        location ~ ^/(docs|redoc|openapi.json) {
            return 404;
        }
    }
