services:
  redis:
    image: redis:7.4
    container_name: aegis-redis
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"      # 내 PC에서만 접속 (LAN에 안 열림)
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  mongo:
    image: mongo:7.0
    container_name: aegis-mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"    # 내 PC에서만 접속 (LAN에 안 열림)
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status() } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}) }; quit(db.hello().isWritablePrimary ? 0 : 1)"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  gateway:
    build:                         # fds/app/Dockerfile로 이미지 생성. 공용 파일(fds/common)을 같이 넣으려고 fds 폴더에서 빌드
      context: ./fds
      dockerfile: app/Dockerfile
    container_name: aegis-gateway
    environment:
      - REDIS_HOST=redis           # 컨테이너 안에서는 서비스 이름으로 Redis 접속
      - MONGO_URI=${MONGO_URI}
      - MONGO_DB=aegis
      - GATEWAY_API_KEY=${GATEWAY_API_KEY}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-}  # 직원 API 키 (관제 웹 백엔드용). 비어 있으면 직원 API만 꺼짐
      - TRANSFERS_TTL_DAYS=0       # transfers 자동 삭제(일). 0 = 끔. ClickHouse 연결 후 14로 켬
      - CLICKHOUSE_URL=http://clickhouse:8123
      - CLICKHOUSE_USER=aegis
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - CLICKHOUSE_DB=aegis
      - PERIOD_PROFILE=demo
      - R05_LIMIT_USDT=${R05_LIMIT_USDT:-50000}
    ports:
      - "8000:8000"                # LAN에 열림 → 봇 PC가 접속
    volumes:
      - ./fds/app:/app/app:ro
      - ./fds/common:/app/common:ro
      - ./fds/logs:/app/logs       # 로그가 내 PC의 C:\aegis-fds\fds\logs 에 쌓임
    depends_on:
      redis:
        condition: service_healthy # Redis가 healthy가 된 뒤에 시작
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.3.1
    container_name: aegis-kafka
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=false
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  publisher:
    build:
      context: ./fds
      dockerfile: app/Dockerfile
    container_name: aegis-publisher
    command: ["python", "-m", "app.publisher"]
    environment:
      - MONGO_URI=${MONGO_URI}
      - MONGO_DB=aegis
      - KAFKA_BOOTSTRAP=kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  alert-consumer:
    build:
      context: ./fds
      dockerfile: app/Dockerfile
    container_name: aegis-alert-consumer
    command: ["python", "-m", "app.alert_consumer"]
    environment:                     # 토픽 이름은 fds/common/keys.py
      - MONGO_URI=${MONGO_URI}
      - MONGO_DB=aegis
      - KAFKA_BOOTSTRAP=kafka:9092
      - REDIS_HOST=redis
      - L1_ACTION=${L1_ACTION:-freeze}
    volumes:
      - ./fds/app:/app/app:ro
      - ./fds/common:/app/common:ro
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  spark:
    build: ./fds/spark             # 공식 Spark 이미지 + pymongo, redis
    container_name: aegis-spark
    user: root
    command: >
      /opt/spark/bin/spark-submit
      --master local[2]
      --driver-memory 2g
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.7
      --conf spark.jars.ivy=/opt/spark/ivy
      /app/spark/stream.py
    environment:                           # 토픽 이름은 fds/common/keys.py
      - KAFKA_BOOTSTRAP=kafka:9092
      - MONGO_URI=${MONGO_URI}             # 최근 2주 기록 조회
      - MONGO_DB=aegis
      - REDIS_HOST=redis
      - PERIOD_PROFILE=demo        # demo: 20분/5분/1분, prod: 2주/24시간/1시간
      - CHECKPOINT_DIR=/checkpoints/detector
      - STARTING_OFFSETS=latest    # 첫 시작 때 과거 메시지로 동결하지 않도록 새 메시지부터 읽음
      - L1_HOLD_SIDE=${L1_HOLD_SIDE:-all}
    volumes:
      - ./fds/spark:/app/spark:ro          # 코드는 이미지에 넣지 않고 연결 (재시작만으로 반영)
      - ./fds/common:/app/common:ro        # 공용 이름·값 (게이트웨이와 같은 파일)
      - spark-ivy:/opt/spark/ivy
      - spark-checkpoints:/checkpoints
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    container_name: aegis-clickhouse
    environment:
      - CLICKHOUSE_DB=aegis
      - CLICKHOUSE_USER=aegis
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    ports:
      - "127.0.0.1:8123:8123"      # 내 PC에서만 접속
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./fds/clickhouse:/docker-entrypoint-initdb.d:ro                          # .sql만 처음 한 번 실행
      - ./fds/clickhouse/kafka.xml:/etc/clickhouse-server/config.d/kafka.xml:ro  # Kafka를 처음부터 읽기
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data:
  mongo-data:
  kafka-data:
  spark-ivy:
  spark-checkpoints:
  clickhouse-data: